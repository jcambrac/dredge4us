# DigitalOcean App Platform spec for server/cmd/api. Documents the
# config to enter in the App Platform console (New App > GitHub repo >
# Dockerfile) when creating the app the first time. deploy_on_push below
# means every push to main redeploys automatically after that — no
# terminal, no CLI.
#
# NEVER put the real DATABASE_URL value in this file — set it through
# the console (Settings > App-Level Environment Variables) after the app
# exists. The placeholder below is intentionally not a working value.

name: dredge4us-api
region: nyc

services:
  - name: api
    github:
      repo: jcl80/dredge4us
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        type: SECRET
        value: "EDIT_ME_IN_DO_CONSOLE"
      - key: API_AUTH_TOKEN
        type: SECRET
        # Bearer token every /findings, /boards, /coverage, /generals,
        # /kinds, /summary, and /debug/* request must present as
        # "Authorization: Bearer <value>" (server/internal/api's
        # withAuth). Same value goes in the frontend's API_AUTH_TOKEN
        # env var — see frontend/.env.example.
        value: "EDIT_ME_IN_DO_CONSOLE"

workers:
  - name: poller
    github:
      repo: jcl80/dredge4us
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile.poller
    source_dir: /
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        type: SECRET
        value: "EDIT_ME_IN_DO_CONSOLE"
      - key: POLLER_BOARDS
        type: GENERAL
        # g, biz have no archive mapping (see docs/archive-sources.md)
        # and stay on live 4chan. his/k/int poll desuarchive.org, news
        # polls archive.palanq.win, instead of a.4cdn.org.
        value: "g:20s,biz:20s,his:desuarchive:20s,k:desuarchive:20s,int:desuarchive:20s,news:palanq:20s"

  # Only touches Postgres + OpenAI, no 4chan API — deploys/fails
  # independently of poller. Generates on startup, then again every
  # hour/day/week; never exits on its own.
  - name: summarizer
    github:
      repo: jcl80/dredge4us
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile.summarizer
    source_dir: /
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        type: SECRET
        value: "EDIT_ME_IN_DO_CONSOLE"
      - key: OPENAI_API_KEY
        type: SECRET
        value: "EDIT_ME_IN_DO_CONSOLE"
      - key: OPENAI_MODEL
        type: GENERAL
        value: "gpt-5.5"
