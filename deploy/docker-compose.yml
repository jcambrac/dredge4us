# Production stack for the reddit-monitoring droplet (134.199.211.6),
# checked out at ~/Projects/dredge4us. Replaces .do/app.yaml: api,
# poller, and summarizer run here, fronted by nginx + Let's Encrypt.
#
# Run everything through the Makefile targets (make deploy, make logs,
# ...) — they pass --env-file .env so ${API_DOMAIN} below resolves from
# the repo-root .env, the same file every service reads its secrets from.
#
# First time only, before `make deploy`: `make cert` (see
# deploy/init-cert.sh) — nginx refuses to start without a certificate.
#
# name: is explicit because the Sentinel stack on this box has none and
# is therefore the compose project "docker"; an unnamed project here
# could collide with it and have `down --remove-orphans` take out the
# other's containers.
name: dredge4us

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dredge4us/api
    container_name: dredge4us-api
    env_file: ../.env
    environment:
      API_ADDR: ":8080"
    # No published port — only nginx reaches it, over the compose network.
    expose:
      - "8080"
    restart: unless-stopped
    logging: *logging

  poller:
    build:
      context: ..
      dockerfile: Dockerfile.poller
    image: dredge4us/poller
    container_name: dredge4us-poller
    env_file: ../.env
    restart: unless-stopped
    logging: *logging

  summarizer:
    build:
      context: ..
      dockerfile: Dockerfile.summarizer
    image: dredge4us/summarizer
    container_name: dredge4us-summarizer
    env_file: ../.env
    restart: unless-stopped
    logging: *logging

  # The official image renders templates/*.template into conf.d at
  # startup, substituting only variables set in its environment — so
  # ${API_DOMAIN} is filled in and nginx's own $host etc. are left alone.
  # The sh wrapper reloads every 6h to pick up certificates certbot renewed.
  nginx:
    image: nginx:1.27-alpine
    container_name: dredge4us-nginx
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $$!; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  # Renews through nginx's /.well-known/acme-challenge/ location. --webroot
  # on renew overrides the standalone authenticator init-cert.sh issued with.
  certbot:
    image: certbot/certbot:latest
    container_name: dredge4us-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"]
    restart: unless-stopped
    logging: *logging

volumes:
  letsencrypt:
  certbot-www:
